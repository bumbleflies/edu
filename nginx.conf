# Nginx configuration for serving Astro static site
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Serve from the dist directory (Astro build output)
    root /usr/share/nginx/html;
    index index.html;

    # Traefik terminates TLS and proxies over http, so nginx cannot know the
    # public scheme. Relative Location headers avoid an https -> http -> https hop.
    absolute_redirect off;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/markdown text/css text/javascript application/javascript application/json;
    gzip_min_length 1000;

    # Cache static assets (CSS, JS, images)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # bumble:futurespace personality headers
    add_header X-Powered-By "bumbleflies and caffeine";
    add_header X-Bumbleflies-Team "3 humans, 0 actual bees";
    add_header X-Bumbleflies-Status "buzzing";

    location = /.well-known/security.txt {
        default_type text/plain;
    }

    # Machine-readable files: CORS for cross-origin agent access
    location = /facts.json {
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=3600";
    }

    location = /llms.txt {
        add_header Cache-Control "public, max-age=3600";
    }

    location = /llms-full.txt {
        add_header Cache-Control "public, max-age=3600";
    }

    # Markdown for agents (/agents.md): mime.types has no .md entry, so without
    # this nginx serves application/octet-stream. Charset goes in charset/
    # charset_types, not default_type, or gzip_types stops matching.
    location ~* \.md$ {
        types { }
        default_type text/markdown;
        charset utf-8;
        charset_types text/markdown;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=3600";
    }

    # Static site, no SPA: unknown URLs are real 404s (src/pages/404.astro).
    # An index.html fallback would answer 200 with the homepage for every typo
    # and every probe (/.well-known/ard.json, /rss.xml ...).
    error_page 404 /404.html;
    location / {
        try_files $uri $uri/ =404;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
